jobs:
  publish:
    permissions:
      actions: read
      packages: write
    uses: pandops/flowai-team-registry/.github/workflows/v0052-publish-oci.yml@909e27e7ed998029d9bdab7ab8551bc00906bd6d
    with:
      expected_workflow_sha: ${{ inputs.expected_workflow_sha }}
