name: Qualify Web UI
run-name: Qualify web-ui at ${{ inputs.expected_source_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Full commit SHA of the selected Web UI ref
        type: string
        required: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Verify dispatch SHA
        shell: bash
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SOURCE_SHA" ]]

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify candidate checkout
        shell: bash
        run: |
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
          test -f go.mod
          test -f test/browser/package-lock.json

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.2'
          cache: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false

      - name: Go unit tests
        run: |
          go mod verify
          go test -mod=readonly -count=1 -coverpkg=./... -v ./...

      - name: Install locked browser unit dependencies
        working-directory: test/browser
        run: |
          npm ci
          node node_modules/playwright/cli.js --version
          node node_modules/playwright/cli.js install --with-deps chromium

      - name: Build untagged Linux amd64 artifact
        run: |
          docker build --platform linux/amd64 -f Containerfile --iidfile "$RUNNER_TEMP/web-ui.iid" .
          cat "$RUNNER_TEMP/web-ui.iid"

      - name: Browser unit tests against the built image
        run: bash test/browser/qualify-browser.sh "$(cat "$RUNNER_TEMP/web-ui.iid")"

      - name: Verify runner-local image after tests
        run: |
          iid="$(cat "$RUNNER_TEMP/web-ui.iid")"
          [[ "$(docker image inspect --format '{{.Id}}' "$iid")" == "$iid" ]]
          [[ "$(docker image inspect --format '{{len .RepoTags}}' "$iid")" == 0 ]]
          echo "Qualified runner-local Web UI OCI config ID $iid"
